wandb:
  entity: null
#  run_id: askkz9i2
  resume: 'auto'

experiment:
    project: "training"
    name: "easy"
    output_dir: "runs/easy"
    max_train_examples_t2i: 40000000
    max_train_examples_mmu: 40000000
    save_every: 10000
    eval_every: 2500
    generate_every: 500
    log_every: 50
    log_grad_norm_every: 50
    resume_from_checkpoint: False

model:
    vq_model:
        type: "magvitv2"
        vq_model_name: "showlab/magvitv2"
    
    tokenize:
        text_tokenizer: "microsoft/phi-1_5"
        vocab_size: 58498
        num_vq_tokens: 256
        num_new_special_tokens: 10  # <|soi|> <|eoi|> <|sov|> <|eov|> <|t2i|> <|mmu|> <|t2v|> <|v2v|> <|lvg|> <|pad|>
        llm_vocab_size: 50295

    vanilla: False

    easy_transformer:

        max_seq_len: 387
        
        image_len: 256

        num_layers_input: 3
        num_layers_output: 3
        d_model: 128
        d_mlp: 512

        num_heads: 4

        dtype: bf16

    gradient_checkpointing: True

dataset:
    gen_type: "imagenet1k"
    und_type: "captioning"
    combined_loader_mode: "max_size_cycle"
    params:
        train_t2i_shards_path_or_url: "/iris/u/armaana/datasets/ILSVRC2012_img_train"
        train_mmu_shards_path_or_url: [ "/iris/u/armaana/datasets/cc12m/cc12m-train-{0000..2175}.tar" ]
        train_lm_shards_path_or_url: "/iris/u/armaana/datasets/c4/en"
        add_caption_prompt: True
        validation_prompts_file: "validation_prompts/text2image_prompts.txt"
        shuffle_buffer_size: 1000
        num_workers: 8
        resolution: 256
        pin_memory: True
        persistent_workers: True

    preprocessing:
        max_seq_length: 128 # for text tokens
        resolution: 256
        center_crop: False
        random_flip: False

optimizer:
    name: adamw
    params: # default adamw params
        learning_rate: 5e-4
        scale_lr: False # scale learning rate by total batch size
        beta1: 0.9
        beta2: 0.999
        weight_decay: 0.01
        epsilon: 1e-8

lr_scheduler:
    scheduler: "cosine"
    params:
        learning_rate: ${optimizer.params.learning_rate}
        warmup_steps: 500

training:
    gradient_accumulation_steps: 1
    noise_type: "mask"
    batch_size_t2i: 10
    batch_size_lm: 10
    batch_size_mmu: 10
    mixed_precision: "bf16"
    enable_tf32: False
    seed: 10086
    max_train_steps: 1000000
    overfit_one_batch: False
    cond_dropout_prob: 0.1
    min_masking_rate: 0.0
    label_smoothing: 0.0
    max_grad_norm: 1.0
    guidance_scale: 0.0
    t2i_coeff: 1.0
    lm_coeff: 0.05
    mmu_coeff: 1.0
